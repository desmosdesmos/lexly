<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A84FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Laxly AI" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Laxly — Ваш AI Юрист</title>
    <script>
      // Принудительный сброс кэша Service Worker для обновления PWA
      if (!localStorage.getItem('cache_busted_v5')) {
        Promise.all([
          'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().then(function(registrations) {
            return Promise.all(registrations.map(r => r.unregister()));
          }) : Promise.resolve(),
          'caches' in window ? caches.keys().then(function(names) {
            return Promise.all(names.map(name => caches.delete(name)));
          }) : Promise.resolve()
        ]).then(() => {
          localStorage.setItem('cache_busted_v5', 'true');
          window.location.reload(true);
        }).catch(() => {
          localStorage.setItem('cache_busted_v5', 'true');
          window.location.reload(true);
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
