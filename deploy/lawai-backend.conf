[program:lawai-backend]
command=/opt/law-ai-agent/backend/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/opt/law-ai-agent/backend
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/opt/law-ai-agent/logs/backend_error.log
stdout_logfile=/opt/law-ai-agent/logs/backend.log
environment=PYTHONPATH="/opt/law-ai-agent/backend"
