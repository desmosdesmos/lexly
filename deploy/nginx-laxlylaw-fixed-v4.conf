server {
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    send_timeout 10s;
    server_name laxlylaw.ru www.laxlylaw.ru;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    access_log /var/log/nginx/laxlylaw_access.log;
    error_log /var/log/nginx/laxlylaw_error.log;

    # Специальный блок для вебхука без лимитов
    location /api/v1/support/telegram-webhook {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        
        # Добавляем отладочный заголовок
        add_header X-Webhook-Processed "true";
    }

    location /api/ {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        alias /opt/law-ai-agent/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        alias /opt/law-ai-agent/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root /opt/law-ai-agent/frontend/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Disable caching for index.html and root
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /static/ {
        alias /opt/law-ai-agent/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 10M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/laxlylaw.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/laxlylaw.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000" always; # managed by Certbot
}

server {
    if ($host = www.laxlylaw.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = laxlylaw.ru) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name laxlylaw.ru www.laxlylaw.ru;
    return 301 https://$host$request_uri;
}
