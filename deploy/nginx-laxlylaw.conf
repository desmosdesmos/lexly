server {
    listen 80;
    server_name laxlylaw.ru www.laxlylaw.ru;

    # Логи
    access_log /var/log/nginx/laxlylaw_access.log;
    error_log /var/log/nginx/laxlylaw_error.log;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Frontend (после сборки)
    location / {
        root /opt/law-ai-agent/frontend/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Статические файлы
    location /static/ {
        alias /opt/law-ai-agent/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Загрузка файлов
    client_max_body_size 10M;
}
